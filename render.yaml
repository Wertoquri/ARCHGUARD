services:
  - type: web
    name: archguard-demo
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: archguard
      - key: MYSQL_SSL
        value: "true"
      - key: POLICY_UI_ENABLE_SAVE
        value: "0"
      - key: POLICY_UI_ENABLE_GITHUB
        value: "0"
      - key: POLICY_UI_ENABLE_EVAL
        value: "0"
      - key: GITHUB_PROFILE_USERNAME
        value: Wertoquri
