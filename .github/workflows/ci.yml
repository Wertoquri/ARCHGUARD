name: CI
on:
  push: { branches: [main] }
  pull_request: {}
  schedule: [{ cron: '0 2 * * *' }]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,md,css}"
      - run: npm test
      - run: npm run figma-ui:install
      - run: npm run figma-ui:build
      - run: docker build -f Dockerfile.prod -t archguard:ci .
  analyze:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node src/cli.js --policy examples/policy.yaml --out findings_raw.json --fail-on critical
      - run: node scripts/apply_baseline.js --in findings_raw.json --out findings.json --baseline config/archguard-baseline.json --summary findings_summary.json --fail-on high
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: archguard-findings, path: "findings*.json" }
